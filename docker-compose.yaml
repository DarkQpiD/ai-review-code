version: "3.9"

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:7

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
